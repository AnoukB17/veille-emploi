# Le "réveil" du robot : GitHub lit ce fichier et lance la collecte tout seul.

name: Collecte des offres

on:
  schedule:
    - cron: "17 6 * * *"   # tous les jours vers 7h17 (heure de Paris en hiver) — l'heure est en UTC
  workflow_dispatch:        # ajoute un bouton "Run workflow" pour lancer à la main

permissions:
  contents: write           # autorise le robot à enregistrer docs/offres.json

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Lancer la collecte
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python collecte.py

      - name: Enregistrer les nouvelles offres
        run: |
          git config user.name "robot-veille-emploi"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/offres.json
          git diff --staged --quiet || git commit -m "Nouvelles offres du $(date +%d/%m/%Y)"
          git push
