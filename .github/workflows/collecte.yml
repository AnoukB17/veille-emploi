# Le "réveil" du robot : GitHub lit ce fichier et lance la collecte tout seul.

name: Collecte des offres

on:
  schedule:
    - cron: "17 6 * * *"   # tous les jours vers 7h17 (heure de Paris en hiver) — l'heure est en UTC
  workflow_dispatch:        # ajoute un bouton "Run workflow" pour lancer à la main
  push:                     # se lance aussi quand le programme ou les réglages changent
    branches: [main]
    paths: ["collecte.py", "config.json", ".github/workflows/collecte.yml"]

permissions:
  contents: write           # autorise le robot à enregistrer docs/offres.json

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Lancer la collecte
        env:
          FRANCE_TRAVAIL_CLIENT_ID: ${{ secrets.FRANCE_TRAVAIL_CLIENT_ID }}
          FRANCE_TRAVAIL_CLIENT_SECRET: ${{ secrets.FRANCE_TRAVAIL_CLIENT_SECRET }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python collecte.py

      - name: Enregistrer les résultats
        if: always()        # même si la collecte a échoué, on garde le journal
        run: |
          git config user.name "robot-veille-emploi"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Collecte du $(date +%d/%m/%Y)"
          git pull --rebase --quiet
          git push
